allowBuilds:
  # El paquete se publica ya compilado (trae dist/), así que no hace falta
  # ejecutar sus scripts de instalación. Lo mismo para protobufjs, que es
  # una dependencia suya.
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  protobufjs: false
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
